# Continuous Integration: install + typecheck + unit tests on every push and pull request.
# Live e2e tests (tests/smoke.test.ts) are intentionally excluded: they require a paid
# GOOGLE_MAPS_API_KEY and are run manually via `npm run test:e2e`.
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (mocked, no API key required)
        run: npm test
