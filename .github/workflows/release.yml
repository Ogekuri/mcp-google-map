# Release: on version tags (v*), verify + build + package the npm tarball and attach it
# to a GitHub Release. Version bump is committed by the maintainer before tagging
# (package.json, package-lock.json, and README.md title share one version).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (mocked, no API key required)
        run: npm test

      - name: Build dist/
        run: npm run build

      - name: Pack npm tarball
        run: npm pack

      - name: Create GitHub Release with tarball
        uses: softprops/action-gh-release@v2
        with:
          files: mcp-google-map-*.tgz
          generate_release_notes: true
